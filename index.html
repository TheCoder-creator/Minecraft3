<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Access Gateway</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
    * { box-sizing: border-box; }
    body, html { margin: 0; width: 100%; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #05070d; color: #e8ecf5; overflow: hidden; }

    #lock-screen {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 30%, #3a0d14, #0b0508 70%);
        transition: opacity .6s ease, background .6s ease; padding: 20px; text-align: center;
    }
    #lock-screen.granted { background: radial-gradient(circle at 50% 30%, #0b3a1f, #040b07 70%); }
    #lock-screen.denied  { animation: shake .4s; }
    @keyframes shake { 25% { transform: translateX(-10px);} 75% { transform: translateX(10px);} }

    .icon { font-size: 54px; margin-bottom: 6px; filter: drop-shadow(0 0 18px rgba(255,82,82,.7)); }
    .granted .icon { filter: drop-shadow(0 0 18px rgba(0,230,118,.8)); }
    h1 { margin: 0 0 6px; font-size: 2.2rem; letter-spacing: 4px; text-transform: uppercase; color: #ff5252; text-shadow: 0 0 20px rgba(255,82,82,.5); }
    .granted h1 { color: #00e676; text-shadow: 0 0 20px rgba(0,230,118,.5); }
    p.sub { margin: 0 0 24px; color: #9aa3bd; }

    .stage {
        position: relative; width: 320px; height: 240px; border-radius: 16px; overflow: hidden;
        border: 2px solid rgba(255,255,255,.2); background: #000; margin-bottom: 22px; display: none;
        box-shadow: 0 0 30px rgba(255,82,82,.25);
    }
    .granted .stage { box-shadow: 0 0 30px rgba(0,230,118,.4); border-color: #00e676; }
    .stage.show { display: block; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .scanline {
        position: absolute; left: 0; right: 0; height: 3px; opacity: 0;
        background: linear-gradient(90deg, transparent, #00e5ff, transparent); box-shadow: 0 0 16px #00e5ff;
    }
    .scanning .scanline { opacity: 1; animation: sweep 1.1s ease-in-out infinite alternate; }
    @keyframes sweep { from { top: 4%; } to { top: 96%; } }

    .scan-btn {
        padding: 15px 44px; font-size: 1.1rem; font-weight: 700; color: #fff; border: 0; border-radius: 40px; cursor: pointer;
        background: linear-gradient(90deg, #ff5252, #ff1744); box-shadow: 0 8px 28px rgba(255,23,68,.45); transition: .2s;
    }
    .scan-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); }
    .scan-btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.6); }
    #scan-status { margin-top: 18px; min-height: 22px; font-size: 1rem; color: #aab3cf; max-width: 420px; }

    /* Full-screen app frame, sits underneath the lock screen */
    #app-frame {
        position: fixed; inset: 0; width: 100%; height: 100%;
        border: 0; background: #fff; display: none;
    }
</style>
</head>
<body>

<iframe id="app-frame" title="Protected App"
        sandbox="allow-forms allow-modals allow-popups allow-scripts allow-same-origin"></iframe>

<div id="lock-screen">
    <div class="icon" id="lockIcon">🔒</div>
    <h1 id="lockTitle">Access Blocked</h1>
    <p class="sub">Identity verification required to proceed</p>

    <div class="stage" id="stage">
        <video id="webcam" autoplay muted playsinline></video>
        <div class="scanline"></div>
    </div>

    <button class="scan-btn" id="btnScan" disabled>Loading...</button>
    <div id="scan-status">Loading recognition models...</div>
</div>

<script>
const SUPABASE_URL = "https://uwpcgccammspgzocjsco.supabase.co";
const SUPABASE_KEY = "sb_publishable_VovyqA7vY-IVd2qke-sCRg_l1LdpMMV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// The page that runs after a successful face match
const APP_URL = "https://raw.githubusercontent.com/TheCoder-creator/Minecraft3/refs/heads/main/id/index.html";

const lockScreen = document.getElementById('lock-screen');
const appFrame = document.getElementById('app-frame');
const stage = document.getElementById('stage');
const video = document.getElementById('webcam');
const btnScan = document.getElementById('btnScan');
const statusDiv = document.getElementById('scan-status');

const tinyOpts = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 });
const MATCH_THRESHOLD = 0.55; // lower = stricter (0.4-0.6 is typical)
let cameraOn = false;

async function initApp() {
    try {
        const URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(URL);
        statusDiv.innerText = "System armed. Ready to scan.";
        btnScan.innerText = "Face ID Scan";
        btnScan.disabled = false;
    } catch (e) {
        statusDiv.innerText = "Model load failed: " + e.message;
    }
}

async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
    });
    video.srcObject = stream;
    stage.classList.add('show');
    await new Promise(res => video.addEventListener('playing', res, { once: true }));
    cameraOn = true;
}

async function grabDescriptor() {
    for (let i = 0; i < 6; i++) {
        const d = await faceapi.detectSingleFace(video, tinyOpts).withFaceLandmarks().withFaceDescriptor();
        if (d) return d;
        await new Promise(r => setTimeout(r, 250));
    }
    return null;
}

// Download the remote HTML and run it inside the iframe
async function loadRemoteApp() {
    const res = await fetch(APP_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("Could not load app (HTTP " + res.status + ")");
    const html = await res.text();
    if (!html.trim()) throw new Error("The app file is empty");
    appFrame.srcdoc = html;
    appFrame.style.display = "block";
    await new Promise(res => appFrame.addEventListener('load', res, { once: true }));
}

async function grantAccess(name) {
    lockScreen.classList.add('granted');
    document.getElementById('lockIcon').innerText = '🔓';
    document.getElementById('lockTitle').innerText = 'Access Granted';
    statusDiv.innerText = `Welcome, ${name}. Loading your app...`;
    statusDiv.style.color = '#00e676';
    btnScan.style.display = 'none';

    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());

    try {
        await loadRemoteApp();
        setTimeout(() => {
            lockScreen.style.opacity = '0';
            setTimeout(() => lockScreen.style.display = 'none', 600);
        }, 600);
    } catch (err) {
        statusDiv.innerText = "Access granted, but the app failed to load: " + err.message;
        statusDiv.style.color = '#ffc107';
        console.error(err);
    }
}

btnScan.addEventListener('click', async () => {
    btnScan.disabled = true;
    try {
        if (!cameraOn) {
            statusDiv.innerText = "Starting camera...";
            await startCamera();
        }

        stage.classList.add('scanning');
        statusDiv.style.color = '#aab3cf';
        statusDiv.innerText = "Scanning... look directly into the lens.";

        const live = await grabDescriptor();
        if (!live) {
            statusDiv.innerText = "No face detected. Face the camera in good light and try again.";
            return;
        }

        statusDiv.innerText = "Checking database...";
        const { data: allowedUsers, error } = await sb.from('allowed_faces').select('*');
        if (error) { statusDiv.innerText = "Database error: " + error.message; return; }
        if (!allowedUsers || allowedUsers.length === 0) {
            statusDiv.innerText = "Access denied. No registered faces found.";
            return;
        }

        let best = { name: "", distance: Infinity };
        for (const user of allowedUsers) {
            const saved = new Float32Array(user.face_embedding);
            const distance = faceapi.euclideanDistance(live.descriptor, saved);
            if (distance < best.distance) best = { name: user.name, distance };
        }

        if (best.distance < MATCH_THRESHOLD) {
            await grantAccess(best.name);
        } else {
            statusDiv.innerText = "Authentication failed. Face not recognized.";
            statusDiv.style.color = '#ffc107';
            lockScreen.classList.add('denied');
            setTimeout(() => lockScreen.classList.remove('denied'), 450);
        }
    } catch (err) {
        statusDiv.innerText = "System error: " + err.message;
        console.error(err);
    } finally {
        stage.classList.remove('scanning');
        if (lockScreen.style.display !== 'none' && !lockScreen.classList.contains('granted')) btnScan.disabled = false;
    }
});

window.addEventListener('load', initApp);
</script>
